[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mir2x-gameplay-workbench"
version = "0.1.0"
description = "Desktop management of Mir2x gameplay configuration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dynaconf>=3.3,<4",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
desktop = [
  "psutil>=5.9.5",
  "pywebview>=6.2",
  "requests>=2.31.0",
]

[project.scripts]
mir2x-workbench = "mir2x_workbench.desktop:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "httpx2>=2.12.0",
  "mypy>=1.15",
  "pyinstaller>=6.16",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
  "types-psutil>=7.0",
  "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mir2x_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.yaml" = "mir2x_workbench/config.yaml"

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/config/config.yaml", "/web/src", "/web/tests", "/web/index.html",
  "/web/*.json", "/web/*.ts", "/web/yarn.lock", "/web/.yarnrc.yml", "/tests",
  "/pyproject.toml", "/uv.lock", "/build_hooks.py", "/build_desktop.py",
  "/CMakeLists.txt", "/README.md", "/Makefile",
]
exclude = ["/.env*", "/web/node_modules", "/web/.yarn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dynaconf"]
ignore_missing_imports = true
