version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s:%(lineno)d %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    stream: ext://sys.stdout
    formatter: default
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    filename: logs/mir2x-gameplay-workbench.log
    maxBytes: 20971520
    backupCount: 5
    encoding: utf-8
    delay: true
    formatter: default

root:
  level: INFO
  handlers: [console, file]

loggers:
  mir2x_workbench:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console, file]
    propagate: false
  watchfiles.main:
    level: INFO
    handlers: [console, file]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: []
    propagate: false
